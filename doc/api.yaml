openapi: 3.0.0


info: 
  title: Wasa Text
  description: |-
    An API for a messaging app that allows users
    to send, receive, and manage messages 
      type:messages and groups.
  version: 0.0.23
  
components:
  schemas:
    User:
      type: object
      description: Details of a user
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^.*$"
          example: "Mario"
          description: Name of a user

        userId:
          type: integer
          minimum: 1
          maximum: 100
          example: 43
          description: Unique ID of a user
          readOnly: true
        
        photo:
          type: string
          format: binary
          description: The photo is a binary file,
          example: "iVBORw0KGgoAAAANSUhEUgAAAAUA..."
          minLength: 4
          maxLength: 1374389 #equivalente di 1MB di foto
    
    Chat:
      type: object
      description: Details of a chat
      properties:
        chatId:
          type: integer
          minimum: 1
          maximum: 1000
          description: Unique ID of a chat
        
        name:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^.*$"
          example: "Mario"
          description: Username or group name
        
        photo:
          $ref: "#/components/schemas/User/properties/photo"
        
        isGroup:
          type: boolean
          description: |
            Indicates if the conversation is a group chat
            or one-on-one chat
          example: false
        
        participants:
          type: array
          minItems: 2  
          maxItems: 500
          description: List of group members
          items:
            $ref: "#/components/schemas/User/properties/userId"
        
        messages:
          type: array
          minItems: 0
          maxItems: 1000
          description: List of messages
          items: 
            $ref: "#/components/schemas/Message"
    
    Message:
      type: object
      description: Details of a message
      properties: 
        messageId:
          type: integer
          minimum: 1
          maximum: 9000
          example: 3
          description: Unique ID of a message
        
        senderId: 
          $ref: "#/components/schemas/User/properties/userId" 
        
        chatId:
          $ref: "#/components/schemas/Chat/properties/chatId"
        
        content:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: "^.*$"
          example: "Hi, i'm marco"
          description: Content of the message
        
        photo:
          $ref: "#/components/schemas/User/properties/photo"
        
        status:
          type: string
          enum: [sent, received, read]
          description: >
            The status of the message:
            - `sent`: The message has been sent but not delivered.
            - `received`: The message has been delivered to the recipient's device.
            - `read`: The message has been read by the recipient.
          example: "read"
        
        timestamp:
          type: string
          format: date-time
          minLength: 0
          maxLength: 22
          example: "2024-11-02T16:26:24Z"
          description: Details about date and time
        
        isForwarded:
          type: boolean
          default: false
          description: If true, the message was forwarded
          example: true

        reactions:
          type: array
          minItems: 0
          maxItems: 500
          description: List of reactions to a message
          items:
            type: object
            properties:
              userId:
                $ref: "#/components/schemas/User/properties/userId"
              reaction:
                type: string
                minLength: 1
                maxLength: 2
                pattern: "^[\u0000-\uFFFF]+$"
                description: Reaction emoji
                example: "🔥"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: plane
  
  parameters:
    ChatId:
      name: chat_id
      in: path
      description: Unique chat id
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    
    MsgId:
      schema:
        type: integer
        minimum: 1
        maximum: 10000
      description: Unique msg id
      required: true
      in: path
      name: msg_id
    
    UserId:
      schema:
        type: integer 
        minimum: 1
        maximum: 1000
        example: 2
      description: Unique user id
      required: true
      in: path
      name: user_id

tags:
  - name: User
    description: Operazioni relative agli utenti
  
  - name: Chat
    description: Operazioni relative alle chat
  
  - name: Message
    description: Operazioni relative ai messaggi

  - name: Group
    description: Operazioni relative ai gruppi

paths:
  /login:
    post:
      tags:
        - User
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              description: Name of user 
              properties:
                name:
                  $ref: "#/components/schemas/User/properties/name"
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                description: Return a identifier
                properties:
                  identifier:
                    type: integer
                    description: identifier
                    example: 2
  
  /user/name:
    put: 
      tags: 
        - User
      summary: Allows a user to set their username
      description: Allows an user to set their username
      operationId: setMyUserName
      security:
        - bearerAuth: []
      requestBody: 
        description: Username details
        content:
          application/json-patch+json:
            schema:
              type: object
              description: New username
              properties:
                newName:
                  $ref: "#/components/schemas/User/properties/name"
        required: true
      responses:
        '200':
          description: Username change action successful
          content: 
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  success:
                    type: string
                    description: Message of success
                    example: "Username changed successfully"
        '400':
          description: Invalid username format or other errors
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "Invalid username format"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found
  
  /user/photo:
    put:
      tags: 
        - User
      summary: Allows a user to set their photo
      description: gives the possibility to update a group photo
      operationId: setMyPhoto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Schema of photo
              properties:
                photo:
                  $ref: "#/components/schemas/User/properties/photo"
      responses:
        '200':
          description: Photo updated successfully
          content: 
            application/json:
              schema:
                type: object
                description: Schema of photo
                properties:
                  photo:
                    $ref: "#/components/schemas/User/properties/photo"
        
        '400':
          description: Invalid request
        
        '401':
          description: Unauthorized request 

  /users:
    get:
      tags: 
        - User
      summary: Allows a user to get the list of all users of the app 
      description: "Allows a user to get a list of app users"
      operationId: listOfUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of app users
          content:
            application/json:
              schema:
                type: object
                description: Schema of array containing all user's app
                properties:
                  users:
                    type: array
                    minItems: 0
                    maxItems: 2000
                    description: Array containing all user's app
                    items:
                      $ref: "#/components/schemas/User"
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "Invalid request"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found

  /chats:
    get:
      tags: 
        - Chat
      summary: Allows a user to get a list of his conversations
      description: Allows a user to get a list of his conversations
      operationId: getMyConversations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user's conversations
          content:
            application/json:
              schema:
                type: object
                description: Schema of chat's list
                properties:
                  chats:
                    type: array
                    minItems: 0
                    maxItems: 2000
                    description: Array containing all the chats
                    items:
                      $ref: "#/components/schemas/Chat"
      
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "Invalid request"
    
    post:
      tags:
        - Chat
      summary: Allows a user to create a new Chat
      description: Endpoint to create a new chat
      operationId: newChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Chat"
            examples:
              createGroupChat:
                summary: Example of creating a group chat
                value:
                  name: "Project Team"
                  isGroup: True
              createDirectChat:
                summary: Example of creating a direct chat
                value:
                  name: "John Doe"
                  isGroup: False
      
      responses:
        '201':
          description: Chat successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        
        '400':
          description: Invalid request
        
        '401':
          description: Unauthorized request
  
  /chats/{chat_id}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    
    get:
      tags: 
        - Chat
      summary: Allows a user to get the details of a single conversation
      description: Allows a user to get the conversation details
      operationId: getConversation
      security:
        - bearerAuth: []
      responses:
        '200':
          description : details of conversation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found
    
    delete:
      tags:
        - Chat
      summary: Allows a user to delete a chat
      description: deletes a conversation, especially the one specified in the path
      operationId: deleteConversation
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Chat successfully deleted
        
        '401':
          description: Unhautorized request
        
        '404':
          description: Conversation not found
  
  /chats/{chat_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    
    post:
      tags: 
        - Message
      summary: Allows a user to send a message
      description: gives the user the possibility to send a message
      operationId: sendMessage
      security:
        - bearerAuth: []
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      
      responses:
        '201':
          description: message sent successfully
          content:
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found

    get:
      tags:
        - Message
      summary: Retrieve the status of all messages in a chat
      description: |
        Retrieves a list of all messages in the specified chat with their respective 
        statuses (`sent`, `received`, or `read`).
      operationId: getAllMessagesStatus
      
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved the list of messages with their status
          content:
            application/json:
              schema:
                type: object
                description: Schema of all messages
                properties:
                  messages:
                    type: array
                    minItems: 0
                    maxItems: 1000
                    description: Schema of all messages
                    items:
                      $ref: "#/components/schemas/Message"
              example:
                summary: Example of all messages with their status
                value:
                  messages:
                    - messageId: 1234
                      chatId: 6890
                      senderId: 5321
                      content: "Hello!"
                      timestamp: "2024-11-27T10:30:00Z"
                      status: "sent"
                    - messageId: 2346
                      chatId: 6890
                      senderId: 5321
                      content: "How are you?"
                      timestamp: "2024-11-27T10:31:00Z"
                      status: "received"
                    - messageId: 1347
                      chatId: 6780
                      senderId: 8765
                      content: "I'm good, thanks!"
                      timestamp: "2024-11-27T10:32:00Z"
                      status: "read"

  /chats/{chat_id}/messages/{msg_id}/status:
    parameters:
          - $ref: "#/components/parameters/ChatId"
          - $ref: "#/components/parameters/MsgId"

    put:
      tags:
        - Message
      summary: Update the status of messages in a chat
      description: >
        This endpoint allows updating the status of one or more messages in a chat. 
        The status can be updated to `sent`, `received`, or `read` based on user actions.
      operationId: updateMessagesStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: List of messages with their new status
              properties:
                messagesStatus:
                  type: array
                  minItems: 0
                  maxItems: 100
                  description: Messages retrieves with their status
                  items:
                    type: object
                    properties:
                      messageId:
                        $ref: "#/components/schemas/Message/properties/messageId"
                      status:
                        $ref: "#/components/schemas/Message/properties/status"

      responses:
        '200':
          description: Successfully updated the status of the messages
          content:
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  updatedMessages:
                    type: array
                    minItems: 0
                    maxItems: 1000
                    description: messages with new status
                    items:
                      type: object
                      properties:
                        messageId:
                          $ref: "#/components/schemas/Message/properties/messageId"
                        status:
                          $ref: "#/components/schemas/Message/properties/status"
        '400':
          description: Invalid request or missing message status
        '401':
          description: Unauthorized request
        '404':
          description: Chat or messages not found

  /chats/{chat_id}/messages/{msg_id}/forward:
    parameters:
      - $ref: "#/components/parameters/ChatId" #ID of the conversation containing the original message
      - $ref: "#/components/parameters/MsgId"  #ID of the original message
    
    post:
      tags: 
        - Message
      summary: Forward a message to another chat
      description: Allows a user to forward an existing message to a different chat.
      operationId: forwardMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Schema of chat
              properties:
                targetChatId:
                  $ref: "#/components/schemas/Chat/properties/chatId"
      
      responses:
        '201':
          description: message forwarded successfully
          content:
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to forward a message in this conversation."
        
        '404':
          description: Conversation or user not found

  /chats/{chat_id}/messages/{msg_id}/reactions:
    parameters:
      - $ref: "#/components/parameters/ChatId" #ID of the conversation containing the message
      - $ref: "#/components/parameters/MsgId"  #ID of the original message
    
    post:
      tags: 
        - Message
      summary: Allows a user to send a reaction to a message
      description: gives a user the possibility to react a message with emoji
      operationId: commentMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Schema of reaction
              properties:
                emoji:
                  type: string
                  description: A single emoji character used as a reaction
                  example: "✌️"
                  minLength: 1
                  maxLength: 2
                  pattern: "^[\u0000-\uFFFF]+$"
      
      responses:
        '200':
          description: Reaction added successfully
          content:
            application/json:
              schema:
                type: object
                description: Message of success
                properties:
                  emoji:
                    type: string
                    description: A single emoji character used as a reaction
                    example: "✌️"
                    minLength: 1
                    maxLength: 2
                    pattern: "^[\u0000-\uFFFF]+$"
                  userId:
                    $ref: "#/components/schemas/User/properties/userId"        
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to add reaction"
        
        '404':
          description: Message not found
    
    delete:
      tags: 
        - Message
      summary: Allows a user to remove a reaction to a message
      description: "Allows a user to remove a previously added emoji reaction from a message."
      operationId: uncommentMessage
      security:
        - bearerAuth: []
      parameters:
        - name: "emoji"
          in: query
          required: true
          description: The emoji to remove as a reaction from the message
          schema:
            type: string
            minLength: 1
            maxLength: 2
            pattern: "^[\u0000-\uFFFF]+$"
            
      responses:
        '204':
          description: Reaction removed successfully
        
        '400':
          description: Invalid input or missing parameters
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "Invalid emoji or message ID"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to remove reaction"
        
        '404':
          description: Message or reaction not found

  /chats/{chat_id}/messages/{msg_id}:
    parameters:
      - $ref: "#/components/parameters/ChatId" #ID of the conversation containing the message
      - $ref: "#/components/parameters/MsgId"  #ID of the message to remove
    
    delete:
      tags: 
        - Message
      summary: Allows a user to delete a message
      description: gives the user the possibility to delete a message
      operationId: deleteMessage
      security:
        - bearerAuth: []

      responses:
        '204':
          description: Message deleted successfully
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to remove reaction"
        
        '404':
          description: Message or reaction not found

  /chats/{chat_id}/members:
    parameters:
      - $ref: "#/components/parameters/ChatId" 

    post:
      tags: 
        - Group
      summary: Add a user to a group chat
      description: Allows a user to add another user to a chat of type group. The chat must have "isGroup:true"
      operationId: addToGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Schema of added user
              properties:
                userId:
                  $ref: "#/components/schemas/User/properties/userId"
      
      responses:
        '201':
          description: User added correctly
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  user:
                    $ref: "#/components/schemas/User/properties/name"
        
        '400':
          description: Invalid request or user already in group
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to add a user to group"
        
        '404':
          description: Message or reaction not found
  
  /chats/{chat_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/UserId"

    delete:
      tags: 
        - Group
      summary: Remove a user from a group chat
      description: Allows a user to remove a member of group. The chat must have "isGroup:true"
      operationId: leaveGroup
      security:
        - bearerAuth: []

      responses:
        '200':
          description: the user has left the group
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  user:
                    $ref: "#/components/schemas/User/properties/name"
        
        '400':
          description: Invalid request

        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to add a user to group"
        
        '404':
          description: Group or user not found

  /chats/{chat_id}/name:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    
    put:
      tags: 
        - Group
      summary: rename a group chat
      description: Allows a user to rename a group chat. The chat must have "isGroup:true"
      operationId: setGroupName
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Shema of group name
              properties:
                name:
                  $ref: "#/components/schemas/Chat/properties/name"
        
      responses:
        '200':
          description: Group name updated successfully
          content:
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  name:
                    type: string
                    description: The new name for the group
        
        '400':
          description: "Invalid input"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to update group name"
        
        '404':
          description: "Group not found"
  
  /chats/{chat_id}/photo:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    
    put:
      tags: 
        - Group
      summary: Set or update a new group photo
      description: Allows the user to update the group photo. The chat must have "isGroup:true"
      operationId: setGroupPhoto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Schema of photo
              properties:
                photo:
                  $ref: "#/components/schemas/User/properties/photo"
      
      responses:
        '200':
          description: Photo updated successfully
          content:
            multipart/form-data:
              schema:
                type: object
                description: Schema of photo
                properties:
                  photo:
                    $ref: "#/components/schemas/User/properties/photo"
        
        '400':
          description: Invalid request
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to update group photo"
