openapi: 3.0.0


info: 
  title: Wasa Text
  description: |-
    An API for a messaging app that allows users
    to send, receive, and manage messages and groups.
  version: 0.0.23
  
components:
  schemas:
    User:
      type: object
      description: Details of a user
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^.*$"
          example: "Mario"
          description: Name of a user

        userId:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: "^.*$"
          example: "Mario23"
          description: Unique ID of a user
          readOnly: true
        
        photo:
          type: string
          format: binary
          description: The photo is a binary file in the payload
          example: "iVBORw0KGgoAAAANSUhEUgAAAAUA..."
          minLength: 0
          maxLength: 1374389 #equivalente di 1MB di foto
    
    Chat:
      type: object
      description: Details of a chat
      properties:
        chatId:
          type: integer
          minimum: 1
          maximum: 10000
          description: Unique ID of a chat
        
        title:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^.*$"
          example: "Chat fami"
          description: Username or group name
        
        photo:
          type: string
          format: binary
          description: The photo is a binary file, it's the user or group photo
          example: "iVBORw0KGgoAAAANSUhEUgAAAAUA..."
          minLength: 0
          maxLength: 1374389 #equivalente di 1MB di foto
        
        isGroup:
          type: boolean
          description: |
            Indicates if the conversation is a group chat
            or one-on-one chat
          example: false
        
        participants:
          type: array
          minItems: 1  
          maxItems: 10000
          description: List of group members
          items:
            $ref: "#/components/schemas/User/properties/userId"
        
        lastMessage:
          $ref: "#/components/schemas/Message"
    
    Message:
      type: object
      description: Details of a message
      properties: 
        messageId:
          type: integer
          minimum: 0
          maximum: 10000
          example: 2
          description: Unique ID of a message
        
        senderId: 
          $ref: "#/components/schemas/User/properties/userId" 
        
        content:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: "^.*$"
          example: "Hi, i'm marco"
          description: Content of the message
        
        photo:
          type: string
          format: binary
          description: The photo is a binary file,
          example: "iVBORw0KGgoAAAANSUhEUgAAAAUA..."
          minLength: 0
          maxLength: 2748778
        
        status:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^.*$"
          description: Details of the status
          example: "Sent"
        
        timestamp:
          type: string
          format: date-time
          minLength: 0
          maxLength: 22
          example: "2024-11-02T16:26:24Z"
          description: Details about date and time
        
        isForwarded:
          type: boolean
          default: false
          description: If true, the message was forwarded
          example: true
    
    Group:
      type: object
      description: Details of a group
      properties:
        groupId:
          type: integer
          minimum: 1
          maximum: 10000
          description: Unique ID of a group

        name:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^.*$"
          example: "football"
          description: Group name
        
        description:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: "^.*$"
          example: "we find ten people!"
          description: Group description
        
        members:
          type: array
          minItems: 1  
          maxItems: 10000
          description: List of group members
          items:
            $ref: "#/components/schemas/User/properties/userId"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: plane
  
  parameters:
    ChatId:
      schema:
        type: integer
        minimum: 1
        maximum: 10000
      description: Unique chat id
      required: true
      in: path
      name: ChatId
    
    MsgId:
      schema:
        type: integer
        minimum: 1
        maximum: 10000
      description: Unique msg id
      required: true
      in: path
      name: MsgId
    
    UserId:
      schema:
        type: string
        pattern: "^.*$"
        example: "mario234"
        minLength: 1
        maxLength: 10000
      description: Unique user id
      required: true
      in: path
      name: UserId
    
    GroupId:
      schema:
        type: integer
        minimum: 1
        maximum: 10000
      description: Unique group id
      required: true
      in: path
      name: GroupId

tags:
  - name: User
    description: Operazioni relative agli utenti
  
  - name: Conversations
    description: Operazioni relative alle chat
  
  - name: Message
    description: Operazioni relative ai messaggi

  - name: Group
    description: Operazioni relative ai gruppi



paths:
  /login:
    post:
      tags:
        - User
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              description: Name of user 
              properties:
                name:
                  $ref: "#/components/schemas/User/properties/name"
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                description: Return a identifier
                properties:
                  identifier:
                    type: string
                    description: identifier
                    example: "abcdef012345"
  
  /user/name:
    patch: 
      tags: 
        - User
      summary: Allows a user to set their username
      description: Allows an user to set their username
      operationId: updateUsername
      security:
        - bearerAuth: []
      requestBody: 
        description: Username details
        content:
          application/json-patch+json:
            schema:
              type: object
              description: New username
              properties:
                newName:
                  $ref: "#/components/schemas/User/properties/name"
        required: true
      responses:
        '200':
          description: Username change action successful
          content: 
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  success:
                    type: string
                    description: Message of success
                    example: "Username changed successfully"
        '400':
          description: Invalid username format or other errors
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "Invalid username format"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found
  
  /user/photo:
    patch:
      tags: 
        - User
      summary: Allows a user to set their photo
      description: gives the possibility to update a group photo
      operationId: setMyPhoto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Schema of photo
              properties:
                photo:
                  $ref: "#/components/schemas/Chat/properties/photo"
      responses:
        '200':
          description: Photo updated successfully
        
        '400':
          description: Invalid request
        
        '401':
          description: Unauthorized request 

  /users:
    get:
      tags: 
        - User
      summary: Allows a user to get the list of all users of the app 
      description: "Allows a user to get a list of app users"
      operationId: listOfUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of app users
          content:
            application/json:
              schema:
                type: object
                description: Schema of array containing all user's app
                properties:
                  users:
                    type: array
                    minItems: 0
                    maxItems: 2000
                    description: Array containing all user's app
                    items:
                      $ref: "#/components/schemas/User"
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "Invalid request"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found

  /conversations:
    get:
      tags: 
        - Conversations
      summary: Allows a user to get a list of his conversations
      description: Allows a user to get a list of his conversations
      operationId: getMyConversations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user's conversations
          content:
            application/json:
              schema:
                type: object
                description: Schema of chat's list
                properties:
                  conversations:
                    type: array
                    minItems: 0
                    maxItems: 2000
                    description: Array containing all the chats
                    items:
                      $ref: "#/components/schemas/Chat"
      
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "Invalid request"
  
  /conversations/{ChatId}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    
    get:
      tags: 
        - Conversations
      summary: Allows a user to get the details of a single conversation
      description: Allows a user to get the conversation details
      operationId: getConversation
      security:
        - bearerAuth: []
      responses:
        '200':
          description : details of conversation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found
    
    delete:
      tags:
        - Conversations
      summary: Allows a user to delete a chat
      description: deletes a conversation, especially the one specified in the path
      operationId: deleteConversation
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Chat successfully deleted
        
        '401':
          description: Unhautorized request
        
        '404':
          description: Conversation not found
  
  /conversations/{ChatId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    
    post:
      tags: 
        - Message
      summary: Allows a user to send a message
      description: gives the user the possibility to send a message
      operationId: sendMessage
      security:
        - bearerAuth: []
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      
      responses:
        '201':
          description: message sent successfully
          content:
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found

  /conversations/{ChatId}/messages/{MsgId}/received:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/MsgId"
    
    patch:
      tags:
        - Message
      summary: Update message status to 'received'
      description: |- 
        Set the status of a message as 'received'
        to indicate receipt by the recipient
      operationId: messageReceived
      requestBody:
        description: New message status
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Schema of status of message
              properties:
                status:
                  $ref: "#/components/schemas/Message/properties/status"
      responses:
        '200':
          description: Message status updated successfully
        
        '404':
          description: Message or status not found
        
        '400':
          description: Invalid request
  
  /conversations/{ChatId}/messages/{MsgId}/read:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/MsgId"
    
    patch:
      tags:
        - Message
      summary: Update the reading status of a message
      description: Update the reading status of a message
      operationId: messageRead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Schema of status of message
              properties:
                status:
                  $ref: "#/components/schemas/Message/properties/status"
    
      responses:
        '200':
          description: Reading status updated successfully
        
        '404':
          description: Message or status not found

  /conversations/{ChatId}/messages/{MsgId}/forward:
    parameters:
      - $ref: "#/components/parameters/ChatId" #ID of the conversation containing the original message
      - $ref: "#/components/parameters/MsgId"  #ID of the original message
    
    post:
      tags: 
        - Message
      summary: Allows a user to forward a message
      description: gives the user the possibility to forward a message
      operationId: forwardMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Schema of chat
              properties:
                targetChatId:
                  $ref: "#/components/schemas/Chat/properties/chatId"
      
      responses:
        '201':
          description: message forwarded successfully
          content:
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
                  isForwarded:
                    type: boolean
                    description: Status of message
                    default: true
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to forward a message in this conversation."
        
        '404':
          description: Conversation or user not found

  /conversations/{ChatId}/messages/{MsgId}/reaction:
    parameters:
      - $ref: "#/components/parameters/ChatId" #ID of the conversation containing the message
      - $ref: "#/components/parameters/MsgId"  #ID of the original message
    
    post:
      tags: 
        - Message
      summary: Allows a user to send a reaction to a message
      description: gives a user the possibility to react a message with emoji
      operationId: commentMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Schema of reaction
              properties:
                emoji:
                  type: string
                  description: A single emoji character used as a reaction
                  example: "✌️"
                  minLength: 1
                  maxLength: 2
                  pattern: "^[\u0000-\uFFFF]+$"
      
      responses:
        '200':
          description: Reaction added successfully
          content:
            application/json:
              schema:
                type: object
                description: Message of success
                properties:
                  reaction:
                    type: object
                    description: Schema of reaction
                    properties:
                      emoji:
                        type: string
                        minLength: 1
                        maxLength: 2
                        pattern: "^[\u0000-\uFFFF]+$"
                        description: Reaction
                      userId:
                        $ref: "#/components/schemas/User/properties/userId"        
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to add reaction"
        
        '404':
          description: Message not found
    
    delete:
      tags: 
        - Message
      summary: Allows a user to remove a reaction to a message
      description: "Allows a user to remove a previously added emoji reaction from a message."
      operationId: unCommentMessage
      security:
        - bearerAuth: []
      parameters:
        - name: "Emoji"
          in: query
          required: true
          description: The emoji to remove as a reaction from the message
          schema:
            type: string
            minLength: 1
            maxLength: 2
            pattern: "^[\u0000-\uFFFF]+$"
            
      responses:
        '200':
          description: Reaction removed successfully
        
        '400':
          description: Invalid input or missing parameters
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "Invalid emoji or message ID"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to remove reaction"
        
        '404':
          description: Message or reaction not found
  
  /conversations/{ChatId}/messages/{MsgId}:
    parameters:
      - $ref: "#/components/parameters/ChatId" #ID of the conversation containing the message
      - $ref: "#/components/parameters/MsgId"  #ID of the message to remove
    
    delete:
      tags: 
        - Message
      summary: Allows a user to delete a message
      description: gives the user the possibility to delete a message
      operationId: deleteMessage
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Message deleted successfully
          content:
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  success:
                    type: string
                    description: Message of success
                    example: "Message deleted successfully"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to remove reaction"
        
        '404':
          description: Message or reaction not found
  
  /groups:
    post:
      tags:
        - Group
      summary: Allows a user to create a group
      description: Endpoint to create a new group
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      
      responses:
        '201':
          description: Group successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        
        '400':
          description: Invalid request
        
        '401':
          description: Unauthorized request

  /groups/{GroupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId" #ID of the group to which the user is being added
    post:
      tags: 
        - Group
      summary: Allows a user to add another user to group
      description: gives a user the possibility to add a user to group
      operationId: addToGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Schema of added user
              properties:
                UserId:
                  $ref: "#/components/schemas/User/properties/userId"
      
      responses:
        '201':
          description: User added correctly
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  user:
                    $ref: "#/components/schemas/User/properties/name"
        
        '400':
          description: Invalid request or user already in group
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to add a user to group"
        
        '404':
          description: Message or reaction not found
  
  /groups/{GroupId}/members/{UserId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: 
        - Group
      summary: Allows a user to remove a member of group
      description: gives the possibility to remove a member of group
      operationId: leaveGroup
      security:
        - bearerAuth: []

      responses:
        '200':
          description: the user has left the group
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  user:
                    $ref: "#/components/schemas/User/properties/name"
        
        '400':
          description: Invalid request
        
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to add a user to group"
        
        '404':
          description: Group or user not found

  /groups/{GroupId}/name:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    
    patch:
      tags: 
        - Group
      summary: Allows a user to give a name a group
      description: gives the possibility a user to rename a group
      operationId: setGroupName
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Shema of group name
              properties:
                name:
                  $ref: "#/components/schemas/Group/properties/name"
        
      responses:
        '200':
          description: Group name updated successfully
          content:
            application/json:
              schema:
                type: object
                description: Schema of success
                properties:
                  name:
                    type: string
                    description: The new name for the group
        
        '400':
          description: "Invalid input"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to update group name"
        
        '404':
          description: "Group not found"
  
  /groups/{GroupId}/photo:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    
    patch:
      tags: 
        - Group
      summary: "Allows a user to set or updated group photo"
      description: Allows the user to update the group photo
      operationId: setGroupPhoto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Schema of photo
              properties:
                photo:
                  $ref: "#/components/schemas/User/properties/photo"
      
      responses:
        '200':
          description: Photo updated successfully
        
        '400':
          description: Invalid request
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                description: Schema of error
                properties:
                  error:
                    type: string
                    description: Message of error
                    example: "User not authorized to update group photo"
  
  
  
  