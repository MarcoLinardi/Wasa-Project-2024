openapi: 3.0.0


info: 
  title: Wasa Text
  description: |-
    An API for a messaging app that allows users
    to send, receive, and manage messages and groups.
  version: 0.0.1
  
components:
  schemas:
    User:
      type: object
      description: Details of a user
      properties:
        name:
          type: string
          description: Name of a user
        userId:
          type: string
          description: Unique ID of a user
          readOnly: true
        photo:
          type: string
          format: uri
          description: URL to the user's or group's profile photo
          example: "https://example.com/photos/group-photo.jpg"
    
    Chat:
      type: object
      description: Details of a chat
      properties:
        chatId:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: "^.*$"
          description: Unique ID of a chat
        title:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^.*$"
          description: Username or group name
        photo:
          type: string
          format: uri
          description: URL to the user's or group's photo
          example: "https://example.com/photos/group-photo.jpg"
        isGroup:
          type: boolean
          description: |- 
            Indicates if the conversation is a group chat
            or one-on-one chat
          example: false
        participants:
          type: array
          minItems: 1  # Numero minimo di messaggi
          maxItems: 10000
          description: List of group members
          items:
            type: string
            minLength: 1
            maxLength: 10000
            pattern: "^.*$"
            description: Single user details
        lastMessage:
          $ref: "#/components/schemas/Message"
    
    Message:
      type: object
      description: Details of a message
      properties: 
        messageId:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: "^.*$"
          description: Unique ID of a message
        senderId: 
          type: string
          minLength: 1
          maxLength: 10000
          pattern: "^.*$"
          description: Unique ID of a user 
        content:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: "^.*$"
          description: Content of the message
        photoUrl:
          type: string
          format: uri
          description: URL to the photo
          example: "https://example.com/photos/message-photo.jpg"
        timestamp:
          type: string
          format: date-time
          example: "2024-11-02T16:26:24Z"
        isForwarded:
          type: boolean
          default: false
          description: If true, the message was forwarded

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: plane
  
  parameters:
    ChatId:
      schema:
        type: string
      required: true
      in: path
      name: ChatId
    
    MsgId:
      schema:
        type: string
      required: true
      in: path
      name: MsgId
    
    UserId:
      schema:
        type: string
      required: true
      in: path
      name: UserId
    
    GroupId:
      schema:
        type: string
      required: true
      in: path
      name: GroupId

tags:
  - name: User
    description: Operazioni relative agli utenti
  
  - name: Conversations
  
  - name: Message
    description: Operazioni relative ai messaggi

  - name: Group
    description: Operazioni relative ai gruppi



paths:
  /login:
    post:
      tags:
        - User
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "user123"
                  pattern: "^.*?$"
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
  
  /user/name:
    patch: 
      tags: 
        - User
      summary: Allows a user to set their username
      description: Allows an user to set their username
      operationId: updateUsername
      security:
        - bearerAuth: []
      requestBody: 
        description: Username details
        content:
          application/json:
            schema:
              type: object
              properties:
                newName:
                  type: string
                  example: "user123"
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '200':
          description: Username change action successful
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Username updated successfully"
        '400':
          description: Invalid username format or other errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid username format"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found
  
  /user/photo:
    patch:
      tags: 
        - User
      summary: Allows a user to set their photo
      description: gives the possibility to update a group photo
      operationId: setMyPhoto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  description: The image file to update
      responses:
        '200':
          description: Photo updated successfully
        
        '400':
          description: Invalid request
        
        '401':
          description: Unauthorized request 

  /users:
    get:
      tags: 
        - User
      summary: Allows a user to get the list of all users of the app 
      description: "Allows a user to get a list of app users"
      operationId: listOfUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of app users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found

  /conversations:
    get:
      tags: 
        - Conversations
      summary: Allows a user to get a list of his conversations
      description: Allows a user to get a list of his conversations
      operationId: getMyConversations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user's conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Chat"
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request"
  
  /conversations/{ChatId}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    
    get:
      tags: 
        - Conversations
      summary: Allows a user to get the details of a single conversation
      description: Allows a user to get the conversation details
      operationId: getConversation
      security:
        - bearerAuth: []
      responses:
        '200':
          description : details of conversation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found
  
  /conversations/{ChatId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    
    post:
      tags: 
        - Message
      summary: Allows a user to send a message
      description: gives the user the possibility to send a message
      operationId: sendMessage
      security:
        - bearerAuth: []
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      
      responses:
        '201':
          description: message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to send a message in this conversation"
        
        '404':
          description: Conversation not found

  /conversations/{ChatId}/messages/{MsgId}/forward:
    parameters:
      - $ref: "#/components/parameters/ChatId" #ID of the conversation containing the original message
      - $ref: "#/components/parameters/MsgId"  #ID of the original message
    
    post:
      tags: 
        - Message
      summary: Allows a user to forward a message
      description: gives the user the possibility to forward a message
      operationId: forwardMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetChatId:
                  type: string
                  example: "Chat8732"
                targetUserId:
                  type: string
                  example: "User1234"
              oneOf:
                - required: ["targetChatId"]
                - required: ["targetUserId"]
      
      responses:
        '201':
          description: message forwarded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
                  isForwarded:
                    type: boolean
                    default: true
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to forward a message in this conversation."
        
        '404':
          description: Conversation or user not found

  /conversations/{ChatId}/messages/{MsgId}/reaction:
    parameters:
      - $ref: "#/components/parameters/ChatId" #ID of the conversation containing the message
      - $ref: "#/components/parameters/MsgId"  #ID of the original message
    
    post:
      tags: 
        - Message
      summary: Allows a user to send a reaction to a message
      description: gives a user the possibility to react a message with emoji
      operationId: commentMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
                  description: A single emoji character used as a reaction
                  maxLength: 2
      
      responses:
        '200':
          description: Reaction added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  reaction:
                    type: object
                    properties:
                      emoji:
                        type: string
                      userId:
                        type: string
                
        
        '400':
          description: Invalid request parameters
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to add reaction"
        
        '404':
          description: Message not found
    
    delete:
      tags: 
        - Message
      summary: Allows a user to remove a reaction to a message
      description: "Allows a user to remove a previously added emoji reaction from a message."
      operationId: unCommentMessage
      security:
        - bearerAuth: []
      parameters:
        - name: "Emoji"
          in: query
          required: true
          description: The emoji to remove as a reaction from the message
          schema:
            type: string
            maxLength: 2
      responses:
        '200':
          description: Reaction removed successfully
        
        '400':
          description: Invalid input or missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid emoji or message ID"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to remove reaction"
        
        '404':
          description: Message or reaction not found
  
  /conversations/{ChatId}/messages/{MsgId}:
    parameters:
      - $ref: "#/components/parameters/ChatId" #ID of the conversation containing the message
      - $ref: "#/components/parameters/MsgId"  #ID of the message to remove
    
    delete:
      tags: 
        - Message
      summary: Allows a user to delete a message
      description: gives the user the possibility to delete a message
      operationId: deleteMessage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Message deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Message deleted successfully"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to remove reaction"
        
        '404':
          description: Message or reaction not found

  /groups/{GroupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId" #ID of the group to which the user is being added
    post:
      tags: 
        - Group
      summary: Allows a user to add another user to group
      description: gives a user the possibility to add a user to group
      operationId: addToGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                UserId:
                  type: string
                  description: "ID of the user to be added to the group"
      
      responses:
        '201':
          description: User added correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        
        '400':
          description: Invalid request or user already in group
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to add a user to group"
        
        '404':
          description: Message or reaction not found
  
  /groups/{GroupId}/members/{UserId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: 
        - Group
      summary: Allows a user to leave a group
      description: gives the possibility to leave a group
      operationId: leaveGroup
      responses:
        '200':
          description: the user has left the group
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        
        '400':
          description: Invalid request
        
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to add a user to group"
        
        '404':
          description: Group or user not found

  /groups/{GroupId}/name:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    
    patch:
      tags: 
        - Group
      summary: Allows a user to give a name a group
      description: gives the possibility a user to rename a group
      operationId: setGroupName
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new name for the group
        
      responses:
        '200':
          description: Group name updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: The new name for the group
        
        '400':
          description: "Invalid input"
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to update group name"
        
        '404':
          description: "Group not found"
  
  /groups/{GroupId}/photo:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    
    patch:
      tags: 
        - Group
      summary: "Allows a user to set or updated group photo"
      description: Allows the user to update the group photo
      operationId: setGroupPhoto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  description: The image file to update
      
      responses:
        '200':
          description: Photo updated successfully
        
        '400':
          description: Invalid request
        
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not authorized to update group photo"
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  