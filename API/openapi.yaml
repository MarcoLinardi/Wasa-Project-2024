openapi: 3.0.0

info: 
  title: Wasa Project 2024
  description: |
    Questa API contiene le regole per
    far si che tutto funzioni al meglio
  version: 0.0.1
  
paths:
  /doLogin:
    post:
      tags: ["Login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
  
  /setMyUserName:
    put: # Usiamo put per aggiornare le informazioni
      tags: ["Set Username"]
      summary: Setting username
      description: |-
        Allows an user to set their username
      operationId: updateUsername
      requestBody: 
        description: Username details
        content:
          application/json:
            schema:
              type: object
              properties:
                newName:
                  type: string
                  example: Marco
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '200':
          description: Username change action successful
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Username updated successfully"
        '400':
          description: Invalid username format or other errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid username format"

  /getMyConversations:
    get:
      tags: [My conversations]
      summary: Get the user's conversation history
      description: |-
        Allows a user to reload his conversations
      operationId: getMyConversations
      parameters:
        - name: limit
          in: query
          description: Number of conversations to retrieve (for pagination)
          required: false
          schema:
            type: integer
            example: 10
        - name: offset
          in: query
          description: Number of converation to skip (for pagination)
          required: false
          schema:
            type: integer
            example: 0
      responses:
        '200':
          description: List of user's conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        conversationId:
                          type: string
                          example: "Chat8732"
                        title:
                          type: string
                          example: "Wasa Project 2024"
                        lastMessage:
                          type: string
                          example: "I'll see you tomorrow in class"
                        timestamp:
                          type: string
                          format: date-time
                          example: "2024-11-02T16:26:24Z"
                  totalConversations:
                    type: integer
                    example: 20
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: "Invalid request"